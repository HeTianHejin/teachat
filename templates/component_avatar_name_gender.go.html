{{ define "component_avatar_name_gender" }}

{{/* 个人头像和名字和性别和身份 */}}

<div>
  <a href="/v1/user/biography?uuid={{ .Uuid }}">
    <img class="img-circle" src="/v1/static/image/user/{{ .Avatar }}.jpeg" alt="个人头像">
  </a>
</div>
  
<div style="text-align: center;">
  {{if .Gender.IsMale}}
  <i class="bi-gender-male" style="font-size: 1.2rem; color: cornflowerblue;"></i>
  {{ else if .Gender.IsFemale }}
  <i class="bi-gender-female" style="font-size: 1.2rem; color:hotpink;"></i>
  {{ else }}
  <i class="bi-question-circle" style="font-size: 1.2rem; color:#bbb;" title="未申报性别"></i>
  {{ end }}
</div>
<div style="text-align: center; margin-top: 1px;">
  <a href="/v1/user/biography?uuid={{ .Uuid }}">{{ .DisplayName }}</a>
  {{ with .RoleLabel }}<span class="label label-info" title="公开申报身份">{{ . }}</span>{{ end }}
</div>

{{ end }}
