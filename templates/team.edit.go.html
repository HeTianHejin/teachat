{{ define "content" }}

<ol class="breadcrumb">
  <li><a href="/v1/">大堂</a></li>
  <li><a href="/v1/teams/joined">茶团事项</a></li>
  <li><a href="/v1/team/manage?uuid={{ .Team.Uuid }}">{{ .Team.Abbreviation }}</a></li>
  <li class="active">更新资料</li>
</ol>

<h3>编辑团队资料</h3>

<!--编辑团队标识-->
<div class="form-group">
  <label>团队标识</label>
  <div>
    {{ if .Team.Logo }}
    <img src="/v1/static/image/team/{{ .Team.Logo }}.jpeg" alt="团队标识" style="max-width: 64px; max-height: 64px; margin-right: 10px;">
    {{ end }}
    <a href="/v1/team/logo?uuid={{ .Team.Uuid }}" class="btn btn-default">更新团队标识</a>
    <p class="help-block">点击按钮上传新的团队标识图片（JPEG格式，建议64x64像素，小于30KB）</p>
  </div>
</div>


<!--编辑团队资料-->
<form action="/v1/team/edit" method="post">
  <input type="hidden" name="team_id" value="{{ .Team.Id }}">
  
  <div class="form-group">
    <label for="name">茶团名称</label>
    <input type="text" class="form-control" id="name" name="name" value="{{ .Team.Name }}" required>
    <p class="help-block">4-24个中文字符</p>
  </div>

  <div class="form-group">
    <label for="abbreviation">队名简称</label>
    <input type="text" class="form-control" id="abbreviation" name="abbreviation" value="{{ .Team.Abbreviation }}" required>
    <p class="help-block">4-6个中文字符</p>
  </div>

  <div class="form-group">
    <label for="mission">团队使命</label>
    <textarea class="form-control" id="mission" name="mission" rows="5" required>{{ .Team.Mission }}</textarea>
    <p class="help-block">请描述团队的使命和目标</p>
  </div>

  <div class="form-group">
    <p><label>茶团性质：</label></p>
    <label class="radio-inline">
      <input type="radio" name="nature" value="1" {{ if eq .Team.Nature 1 }}checked{{ end }} required> 职业团队 - 标签需选自行业白名单
    </label>
    <label class="radio-inline">
      <input type="radio" name="nature" value="2" {{ if eq .Team.Nature 2 }}checked{{ end }} required> 业余团队 - 兴趣爱好，标签可自由填写
    </label>
  </div>

  <div class="form-group" id="amateur-tags-group">
    <label for="tags">分类标签（用逗号分隔，最多 5 个）</label>
    <input type="text" class="form-control" id="tags" name="tags" value="{{ .Team.Tags }}"
           placeholder="如：诗词书法,手作茶饮,徒步" maxlength="200" />
    <p class="help-block">业余团队可自由填写，逗号分隔；超过 5 个或过长的标签会被自动裁剪。</p>
  </div>

  <div class="form-group" id="professional-tags-group">
    <label>行业分类（职业团队必选，至少选到“大类”）</label>
    <div class="row">
      <div class="col-sm-3">
        <select class="form-control" id="industry-level1">
          <option value="">门类</option>
          {{ range .IndustryTags }}
          <option value="{{ .Id }}">{{ .Code }} {{ .Name }}</option>
          {{ end }}
        </select>
      </div>
      <div class="col-sm-3">
        <select class="form-control" id="industry-level2" disabled>
          <option value="">大类</option>
        </select>
      </div>
      <div class="col-sm-3">
        <select class="form-control" id="industry-level3" disabled>
          <option value="">中类（可选）</option>
        </select>
      </div>
      <div class="col-sm-3">
        <select class="form-control" id="industry-level4" disabled>
          <option value="">小类（可选）</option>
        </select>
      </div>
    </div>
    <input type="hidden" name="primary_industry_tag_id" id="primary_industry_tag_id" value="{{ .Team.PrimaryIndustryTagID }}" />
    <p class="help-block" id="industry-path-preview">当前行业：{{ .Team.Tags }}。如需变更，请重新选择门类 → 大类。</p>
  </div>

  <script>window.__INDUSTRY_CHAIN = [{{ range .IndustryChain }}{{ .Id }},{{ end }}];</script>
  <script>
    (function () {
      var selects = [];
      for (var i = 1; i <= 4; i++) {
        selects.push(document.getElementById('industry-level' + i));
      }
      var hidden = document.getElementById('primary_industry_tag_id');
      var preview = document.getElementById('industry-path-preview');
      var proGroup = document.getElementById('professional-tags-group');
      var amateurGroup = document.getElementById('amateur-tags-group');
      var chain = window.__INDUSTRY_CHAIN || [];

      function natureValue() {
        var el = document.querySelector('input[name="nature"]:checked');
        return el ? el.value : '';
      }

      function toggleByNature() {
        var isPro = natureValue() === '1';
        if (proGroup) proGroup.style.display = isPro ? '' : 'none';
        if (amateurGroup) amateurGroup.style.display = isPro ? 'none' : '';
      }

      function fill(select, items, placeholder) {
        var html = '<option value="">' + placeholder + '</option>';
        for (var i = 0; i < items.length; i++) {
          html += '<option value="' + items[i].id + '">' + items[i].code + ' ' + items[i].name + '</option>';
        }
        select.innerHTML = html;
        select.disabled = items.length === 0;
      }

      function syncSelection() {
        var id = '';
        var names = [];
        for (var i = 0; i < selects.length; i++) {
          var sel = selects[i];
          if (!sel || !sel.value) { break; }
          id = sel.value;
          names.push(sel.options[sel.selectedIndex].text);
        }
        if (hidden) { hidden.value = id; }
        if (preview) {
          preview.textContent = id
            ? '已选择：' + names.join(' › ')
            : '请选择行业门类 → 大类，可继续细分到中类/小类。';
        }
      }

      function load(select, parentId, done) {
        fetch('/v1/team/industry_children?parent=' + encodeURIComponent(parentId))
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (items) { fill(select, items || [], '请选择'); if (done) { done(); } })
          .catch(function () { fill(select, [], '请选择'); if (done) { done(); } });
      }

      for (var i = 0; i < selects.length; i++) {
        (function (index) {
          var sel = selects[index];
          if (!sel) { return; }
          sel.addEventListener('change', function () {
            for (var j = index + 1; j < selects.length; j++) {
              fill(selects[j], [], '请选择');
            }
            if (sel.value && index + 1 < selects.length) {
              load(selects[index + 1], sel.value, null);
            }
            syncSelection();
          });
        })(i);
      }

      var radios = document.querySelectorAll('input[name="nature"]');
      for (var k = 0; k < radios.length; k++) {
        radios[k].addEventListener('change', toggleByNature);
      }

      function prefill() {
        var idx = 0;
        function step() {
          if (idx >= chain.length || idx >= selects.length) { syncSelection(); return; }
          var sel = selects[idx];
          if (!sel) { syncSelection(); return; }
          sel.value = String(chain[idx]);
          if (idx + 1 < selects.length) {
            load(selects[idx + 1], chain[idx], function () { idx++; step(); });
          } else {
            idx++; step();
          }
        }
        step();
      }

      toggleByNature();
      if (chain.length) { prefill(); } else { syncSelection(); }
    })();
  </script>

  <div class="form-group">
    <button type="submit" class="btn btn-primary">保存修改</button>
    <a href="/v1/team/manage?uuid={{ .Team.Uuid }}" class="btn btn-default">取消</a>
  </div>
</form>

{{ end }}
