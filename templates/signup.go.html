{{ define "content" }}

<ol class="breadcrumb">
  <li><a href="/v1/">大堂</a></li>
  <li class="active">注册新账号</li>
</ol>

<div class="panel panel-default">
  <div class="panel-heading">
    <span class="lead">新茶友出没注意</span>
  </div>

  <div class="panel-body">
    <form class="form-signin" role="form" action="/v1/signup_account" method="post">

      <label for="alias_name">花名 / 字号（可选）</label>
      <input id="alias_name" type="text" name="alias_name" class="form-control" placeholder="例如：阿四、老农、青禾" maxlength="24" autofocus>
      <label for="family_name">姓 / 家族名（可选）</label>
      <input id="family_name" type="text" name="family_name" class="form-control" placeholder="例如：李" maxlength="24">
      <label for="given_name">名（可选）</label>
      <input id="given_name" type="text" name="given_name" class="form-control" placeholder="例如：四" maxlength="24">
      <input id="email" type="email" name="email" class="form-control" placeholder="电子邮箱" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
      <label for="password">至少6个字符，建议8个字母、数字和英文标点组合</label>
      <input id="password" type="password" name="password" class="form-control" placeholder="密码" minlength="6"
        maxlength="42" required>
      <label for="biography">个人简介</label>
      <input id="biography" type="text" name="biography" class="form-control" value="千红一窟，饮到荼蘼花事了。" required>

      <div>
        <fieldset>
          <legend style="font-size: small;">洗手间服务：
            <input type="radio" name="gender" id="male" style="width: fit-content;" value="1" required />
            <label for="male">
              男<i class="bi-gender-male" style="font-size: 1.4rem; color: cornflowerblue;"></i>
              </label>
              &nbsp;
            <input type="radio" name="gender" id="female" style="width: fit-content;" value="0" required />
            <label for="female ">
              女<i class="bi-gender-female" style="font-size: 1.4rem; color: pink;"></i>
              </label>
          </legend>
        </fieldset>
      </div>

      <button class="btn btn-lg btn-primary btn-block" type="submit">注 册</button>
    </form>
  </div>

</div>

{{ end }}
