{{ define "content" }}

<ol class="breadcrumb">
  <li><a href="/v1/">大堂</a></li>
  <li><a href="/v1/group/create">新建集团</a></li>
  <li class="active">新建茶话团队</li>

</ol>

<div class="panel panel-default">

  <div class="panel-heading">
    新建茶话团队
  </div>

  <form role="form" action="/v1/team/create" method="post">

    <div class="panel-body">

      <div class="form-group">
        <p><label>选择茶团性质：</label></p>
        <label class="radio-inline">
          <input type="radio" name="nature" id="nature-amateur" value="2" required> 业余团队 - 兴趣爱好，标签可自由填写
        </label>
        <label class="radio-inline">
          <input type="radio" name="nature" id="nature-professional" value="1" required> 职业团队 - 标签需选自行业白名单
        </label>
      </div>

      <div class="form-group">
        <p><label for="public">选择您的茶团属性：</label></p>
        <label class="radio-inline">
          <input type="radio" name="class" id="public" value="10" required> 开放式-所有人均可申请加入
        </label>
        <label class="radio-inline">
          <input type="radio" name="class" id="private" value="20" required> 封闭式-仅受邀人可以加入
        </label>
      </div>

      <div class="form-group">
        <label for="is_private">隐私设置：</label>
        <div class="checkbox">
          <label>
            <input type="checkbox" name="is_private" id="is_private" value="true" />
            私密团队 - 不在公开列表中显示，但可以接收通知和作业进度
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="name">请赐名新茶团（4～19字）</label>
        <input type="text" class="form-control" name="name" id="name" minlength="4" maxlength="42" required />
      </div>

      <div class="form-group">
        <label for="abbreviation">茶团简称（4～6字）</label>
        <input type="text" class="form-control" name="abbreviation" id="abbreviation" minlength="4" maxlength="8"
          required />
      </div>

      <div class="form-group">
        <label for="mission">请介绍茶团愿景（17～456字，需要友邻蒙评通过）</label>
        <textarea class="form-control" name="mission" id="mission" rows="3" minlength="7" maxlength="567"
          required></textarea>
      </div>

      <div class="form-group" id="amateur-tags-group">
        <label for="tags">分类标签（用逗号分隔，最多 5 个）</label>
        <input type="text" class="form-control" name="tags" id="tags"
               placeholder="如：诗词书法,手作茶饮,徒步" maxlength="200" />
        <p class="help-block">业余团队可自由填写，逗号分隔；超过 5 个或过长的标签会被自动裁剪。</p>
      </div>

      <div class="form-group" id="professional-tags-group">
        <label>行业分类（职业团队必选，至少选到“大类”）</label>
        <div class="row">
          <div class="col-sm-3">
            <select class="form-control" id="industry-level1">
              <option value="">门类</option>
              {{ range .IndustryTags }}
              <option value="{{ .Id }}">{{ .Code }} {{ .Name }}</option>
              {{ end }}
            </select>
          </div>
          <div class="col-sm-3">
            <select class="form-control" id="industry-level2" disabled>
              <option value="">大类</option>
            </select>
          </div>
          <div class="col-sm-3">
            <select class="form-control" id="industry-level3" disabled>
              <option value="">中类（可选）</option>
            </select>
          </div>
          <div class="col-sm-3">
            <select class="form-control" id="industry-level4" disabled>
              <option value="">小类（可选）</option>
            </select>
          </div>
        </div>
        <input type="hidden" name="primary_industry_tag_id" id="primary_industry_tag_id" value="" />
        <p class="help-block" id="industry-path-preview">请选择行业门类 → 大类，可继续细分到中类/小类。</p>
      </div>

      <script>window.__INDUSTRY_CHAIN = [];</script>
      <script>
        (function () {
          var selects = [];
          for (var i = 1; i <= 4; i++) {
            selects.push(document.getElementById('industry-level' + i));
          }
          var hidden = document.getElementById('primary_industry_tag_id');
          var preview = document.getElementById('industry-path-preview');
          var proGroup = document.getElementById('professional-tags-group');
          var amateurGroup = document.getElementById('amateur-tags-group');
          var chain = window.__INDUSTRY_CHAIN || [];

          function natureValue() {
            var el = document.querySelector('input[name="nature"]:checked');
            return el ? el.value : '';
          }

          function toggleByNature() {
            var isPro = natureValue() === '1';
            if (proGroup) proGroup.style.display = isPro ? '' : 'none';
            if (amateurGroup) amateurGroup.style.display = isPro ? 'none' : '';
          }

          function fill(select, items, placeholder) {
            var html = '<option value="">' + placeholder + '</option>';
            for (var i = 0; i < items.length; i++) {
              html += '<option value="' + items[i].id + '">' + items[i].code + ' ' + items[i].name + '</option>';
            }
            select.innerHTML = html;
            select.disabled = items.length === 0;
          }

          function syncSelection() {
            var id = '';
            var names = [];
            for (var i = 0; i < selects.length; i++) {
              var sel = selects[i];
              if (!sel || !sel.value) { break; }
              id = sel.value;
              names.push(sel.options[sel.selectedIndex].text);
            }
            if (hidden) { hidden.value = id; }
            if (preview) {
              preview.textContent = id
                ? '已选择：' + names.join(' › ')
                : '请选择行业门类 → 大类，可继续细分到中类/小类。';
            }
          }

          function load(select, parentId, done) {
            fetch('/v1/team/industry_children?parent=' + encodeURIComponent(parentId))
              .then(function (r) { return r.ok ? r.json() : []; })
              .then(function (items) { fill(select, items || [], '请选择'); if (done) { done(); } })
              .catch(function () { fill(select, [], '请选择'); if (done) { done(); } });
          }

          for (var i = 0; i < selects.length; i++) {
            (function (index) {
              var sel = selects[index];
              if (!sel) { return; }
              sel.addEventListener('change', function () {
                for (var j = index + 1; j < selects.length; j++) {
                  fill(selects[j], [], '请选择');
                }
                if (sel.value && index + 1 < selects.length) {
                  load(selects[index + 1], sel.value, null);
                }
                syncSelection();
              });
            })(i);
          }

          var radios = document.querySelectorAll('input[name="nature"]');
          for (var k = 0; k < radios.length; k++) {
            radios[k].addEventListener('change', toggleByNature);
          }

          function prefill() {
            var idx = 0;
            function step() {
              if (idx >= chain.length || idx >= selects.length) { syncSelection(); return; }
              var sel = selects[idx];
              if (!sel) { syncSelection(); return; }
              sel.value = String(chain[idx]);
              if (idx + 1 < selects.length) {
                load(selects[idx + 1], chain[idx], function () { idx++; step(); });
              } else {
                idx++; step();
              }
            }
            step();
          }

          toggleByNature();
          if (chain.length) { prefill(); } else { syncSelection(); }
        })();
      </script>

      <div class="form-group; col-xs-offset-5 col-sm-offset-5 col-md-offset-5 col-lg-offset-5">
        <button type="submit" class="btn btn-default">提交</button>
      </div>

    </div>
  </form>

  <div class="panel-footer">
    自斟自饮的茶博士：举杯邀明月，对影成三人。三人行，必有茶师焉。择其善者而品之，其不善者而泡之。
  </div>

</div>

{{ end }}
